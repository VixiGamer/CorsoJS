<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizzatore di Glicemia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Analisi Glicemia</h1>
    <p>Inserisci il tuo valore a digiuno (mg/dL) per verificare in quale fascia rientra.</p>
    
    <input type="number" id="bloodSugar" placeholder="es. 95" />
    <button id="analyzeBtn">Analizza Valore</button>
    
    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
