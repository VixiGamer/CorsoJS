<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatrice JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <div id="screen">0</div>
        
        <div class="buttons">
            <button class="btn clear" id="btnC">C</button>
            <button class="btn op" id="btnDiv">/</button>
            <button class="btn op" id="btnMult">*</button>
            <button class="btn op" id="btnMeno">-</button>

            <button class="btn num" id="btn7">7</button>
            <button class="btn num" id="btn8">8</button>
            <button class="btn num" id="btn9">9</button>
            <button class="btn op" id="btnPiu">+</button>

            <button class="btn num" id="btn4">4</button>
            <button class="btn num" id="btn5">5</button>
            <button class="btn num" id="btn6">6</button>
            <button class="btn uguali" id="btnEq">=</button>

            <button class="btn num" id="btn1">1</button>
            <button class="btn num" id="btn2">2</button>
            <button class="btn num" id="btn3">3</button>
            <button class="btn num" id="btn0">0</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
