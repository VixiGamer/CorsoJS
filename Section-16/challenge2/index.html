<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Images Challenge</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: white;
            color: #222;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .images {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            min-height: 400px;
        }

        .images img {
            width: 900px;
            max-width: 90vw;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="images"></div>

    <script src="script.js"></script>
</body>
</html>
